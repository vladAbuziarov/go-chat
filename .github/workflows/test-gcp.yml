name: Test GCP Auth

on: ['push']

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Print Project
        run: |
          gcloud config list project
      - name: Push to GCR
        run: |
          echo "Pushing to GCR"
          docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/server:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT }}/server:${{ github.sha }}